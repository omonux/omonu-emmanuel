<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>OMONUX • Create Account</title><link rel="icon" href="logo.svg"/><link rel="stylesheet" href="style.css"/><style>body{display:grid;place-items:center;min-height:100vh}.shell{width:min(460px,94%)}.right{border-radius:var(--radius-lg);border:1px solid var(--stroke);background:var(--card);box-shadow:var(--shadow);padding:28px}.brand{display:flex;align-items:center;gap:12px;font-weight:900;margin-bottom:18px}.brand img{width:40px;height:40px;border-radius:14px;object-fit:cover;border:1px solid var(--stroke)}.panelTitle{margin:0 0 6px;font-size:20px}.panelHint{margin:0 0 16px;color:var(--muted);font-size:14px;line-height:1.5}.row{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px}.smallLink{color:var(--gold);font-weight:800;font-size:13px}.strength{height:5px;border-radius:999px;background:rgba(255,255,255,.10);margin-top:8px;overflow:hidden}.strength>div{height:100%;width:0%;background:var(--red);transition:width .2s ease,background .2s ease}</style></head><body><div class="shell"><div class="right"><div class="brand"><img src="logo.svg" alt="OMONUX"/><div>OMONUX <span style="color:var(--muted);font-weight:900">PRO</span></div></div><h2 class="panelTitle">Create your account</h2><p class="panelHint">Start in Signal Only mode. No real money is ever at risk in paper trading.</p><div class="warn" id="warnBox" style="display:none;margin-bottom:12px;padding:10px 12px;border-radius:12px;border:1px solid rgba(239,68,68,.25);background:rgba(239,68,68,.10);font-weight:800;font-size:13px"></div><form id="signupForm"><label for="email">Email</label><input id="email" type="email" placeholder="you@example.com" autocomplete="email"/><label for="password">Password</label><input id="password" type="password" placeholder="••••••••" autocomplete="new-password"/><div class="strength"><div id="strengthBar"></div></div><label for="confirm">Confirm password</label><input id="confirm" type="password" placeholder="••••••••" autocomplete="new-password"/><div class="row"><a class="smallLink" href="login.html">Already have an account?</a><a class="smallLink" href="index.html">Back home</a></div><button class="btn primary wide" type="submit" style="margin-top:16px">Create Account</button><button class="btn ghost wide" type="button" style="margin-top:10px" onclick="location.href='login.html'">Log in instead</button></form><div class="foot">OMONUX • Trade smarter, not gamble.</div></div></div><script>const form=document.getElementById('signupForm'),warnBox=document.getElementById('warnBox'),strengthBar=document.getElementById('strengthBar'),passInput=document.getElementById('password');passInput.addEventListener('input',()=>{const v=passInput.value;let score=0;if(v.length>=8)score++;if(/[A-Z]/.test(v))score++;if(/[0-9]/.test(v))score++;if(/[^A-Za-z0-9]/.test(v))score++;strengthBar.style.width=(score/4)*100+'%';strengthBar.style.background=['#ef4444','#ef4444','#f6c945','#f6c945','#22c55e'][score]});function showWarn(msg){warnBox.style.display='block';warnBox.textContent=msg}form.addEventListener('submit',async e=>{e.preventDefault();const email=document.getElementById('email').value.trim(),pass=passInput.value,confirm=document.getElementById('confirm').value,submitBtn=form.querySelector('button[type="submit"]');if(!email||!pass||!confirm)return showWarn('Please fill in every field.');if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return showWarn('Please enter a valid email address.');if(pass.length<8)return showWarn('Password must be at least 8 characters.');if(pass!==confirm)return showWarn('Passwords do not match.');submitBtn.disabled=true;submitBtn.textContent='Creating account…';warnBox.style.display='none';try{const {token,user}=await window.OmonuxAPI.register(email,pass);window.OmonuxAPI.setSession(token,user);location.href='dashboard.html'}catch(err){showWarn(err.offline?'Can\'t reach the OMONUX backend. Start it with `npm start` inside /server, then try again.':(err.message||'Couldn\'t create your account. Please try again.'))}finally{submitBtn.disabled=false;submitBtn.textContent='Create Account'}});</script><script src="app.js"></script></body></html>
