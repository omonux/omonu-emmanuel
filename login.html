<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>OMONUX • Login</title><link rel="icon" href="logo.svg"/><link rel="stylesheet" href="style.css"/><style>body{display:grid;place-items:center}.shell{width:min(980px,94%);display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.left,.right{border-radius:26px;border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 50px rgba(0,0,0,.45);padding:26px}.left{background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.05))}.right{background:rgba(17,24,39,.70)}.brand{display:flex;align-items:center;gap:12px;font-weight:900;margin-bottom:16px}.headline{margin:6px 0 10px;font-size:clamp(26px,3vw,36px);line-height:1.05}.sub{color:var(--muted);line-height:1.6}.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);font-weight:800;font-size:13px}.dot{width:8px;height:8px;border-radius:999px;background:var(--green)}.panelTitle{margin:0 0 8px;font-size:18px}.panelHint{color:var(--muted);font-size:14px}.row{display:flex;justify-content:space-between;margin-top:10px}.smallLink{color:var(--gold);font-weight:800;font-size:13px}.btn{width:100%;padding:12px 14px;border-radius:12px;border:none;cursor:pointer;font-weight:900;background:linear-gradient(135deg,rgba(124,58,237,.95),rgba(37,99,235,.95));color:white;margin-top:14px}.ghost{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--stroke);background:var(--card-soft);color:var(--text);font-weight:900;cursor:pointer;margin-top:10px}.foot{margin-top:16px;color:var(--muted);font-size:13px;text-align:center;font-weight:800}.warn{display:none;margin-top:12px;padding:10px 12px;border-radius:12px;border:1px solid rgba(239,68,68,.25);background:rgba(239,68,68,.10);font-weight:800;font-size:13px}@media(max-width:900px){.shell{grid-template-columns:1fr}.left{display:none}}</style></head>
<body><div class="shell"><section class="left"><div class="brand"><img src="logo.svg" alt="OMONUX" style="width:40px;height:40px;border-radius:14px;object-fit:cover"/><div>OMONUX <small>PRO</small></div></div><h1 class="headline">Login and continue your trading session.</h1><p class="sub">Welcome back. OMONUX keeps your app in <b>Signal Only</b> mode by default. You stay in control.</p><div class="chips"><div class="chip"><span class="dot"></span> Live Prices</div><div class="chip">TP/SL Suggestions</div><div class="chip">Risk Control</div></div></section><section class="right"><h2 class="panelTitle">Login to OMONUX</h2><p class="panelHint">Sign in to your OMONUX account.</p><div class="warn" id="warnBox"></div><form id="loginForm"><label for="email">Email</label><input id="email" type="email" placeholder="you@example.com" autocomplete="email"/><label for="pass">Password</label><input id="pass" type="password" placeholder="••••••••" autocomplete="current-password"/><div class="row"><a class="smallLink" href="signup.html">Create account</a><a class="smallLink" href="index.html">Back home</a></div><button class="btn" type="submit">Login</button><button class="ghost" type="button" onclick="location.href='signup.html'">Sign up instead</button><div class="foot">OMONUX • Trade smarter, not gamble.</div></form></section></div><script src="app.js"></script><script>const form=document.getElementById('loginForm'),warnBox=document.getElementById('warnBox'),submitBtn=form.querySelector('button[type="submit"]');function showWarn(msg){warnBox.style.display='block';warnBox.textContent=msg}form.addEventListener('submit',async e=>{e.preventDefault();const email=document.getElementById('email').value.trim(),pass=document.getElementById('pass').value.trim();if(!email||!pass)return showWarn('Please enter both email and password.');submitBtn.disabled=true;submitBtn.textContent='Logging in…';warnBox.style.display='none';try{const {token,user}=await window.OmonuxAPI.login(email,pass);window.OmonuxAPI.setSession(token,user);location.href='dashboard.html'}catch(err){showWarn(err.offline?'Can\'t reach the OMONUX backend. Start it with `npm start` inside /server, then try again.':(err.message||'Login failed. Please try again.'))}finally{submitBtn.disabled=false;submitBtn.textContent='Login'}});</script></body></html>
